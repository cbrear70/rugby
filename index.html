<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Picker">
<meta name="theme-color" content="#0E1712">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Rugby Team Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0E1712; --panel:#15231B; --panel2:#1C2E23; --line:#2A4032;
  --ink:#EDF3EE; --muted:#95AA9B; --accent:#F2C230; --accent-ink:#1A1405; --danger:#E4573F; --ok:#5BC77A;
  --display:"Saira Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --body:"Barlow",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* top bar */
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 16px;border-bottom:1px solid var(--line)}
.team-btn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;text-align:left}
.team-btn .tn{font:800 23px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-btn svg{flex:none;opacity:.7}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:10px;color:var(--ink)}
.icon-btn:active{background:var(--panel2)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tabbar button{background:none;border:0;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.tabbar button[aria-selected="true"]{color:var(--accent)}

/* pitch */
.toolrow{display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 13px/1.1 var(--body)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{filter:brightness(1.2)}
.toolrow .spacer{flex:1}
.pitch-wrap{flex:1;min-height:0;position:relative;background:#1B4F27}
.pitch{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pitch .num{font-family:var(--display);font-weight:800}
.pitch .lbl{font-family:var(--body);font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:1.2px;stroke-linejoin:round}
.pitch .tok{cursor:grab}
.pitch .tok.dim{opacity:.3}
.pitch .tok.ghost{opacity:.55}
.pitch .path{fill:none;stroke-width:.45;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.pitch .path.dim{opacity:.15}
.pitch .path.ed{stroke-width:.6;opacity:1}
.pitch .fdot{fill:rgba(255,255,255,.25);stroke:#fff;stroke-width:.22}
.pitch .fdot.key{fill:var(--accent);stroke:#1A1405}
.pitch .fdot.cur{stroke:#fff;stroke-width:.45;fill:#fff}
.pitch .fdot.key.cur{fill:var(--accent);stroke:#fff}
.pitch .pdot{stroke:none}
.pitch .fdot.held{fill:none;stroke:rgba(255,255,255,.45);stroke-width:.15}
.pitch .fdot.held.cur{stroke:#fff;stroke-width:.3}
.carry-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chain{display:flex;flex-direction:column}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.step.warn{border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.step-top{display:flex;gap:8px;align-items:center}
.step-top select{flex:1;width:auto;min-width:0;padding:8px 10px;font-size:15px}
.sbtn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0}
.sbtn:disabled{opacity:.3}
.sbtn:active{background:var(--line)}
.sbtn.del{color:var(--danger)}
.pass-link .ins{margin-left:auto}
.vtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vrow{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.vrow:last-child{border-bottom:0}
.vhead{background:none;padding:6px 12px;font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vhead span{text-align:center}
.vwho{display:flex;align-items:center;gap:10px;min-width:0}
.vwho b{display:block;font-weight:600}
.vwho small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtg{display:grid;place-items:center;height:36px}
.vtg input{width:24px;height:24px;accent-color:var(--accent)}
.vtg input:disabled{opacity:.35}
.tlwrap{display:flex;flex-direction:column;gap:3px}
.tlgrid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.tl{height:30px;border:0;border-radius:4px;background:var(--panel2);padding:0;position:relative;outline:1px solid var(--line);outline-offset:-1px}
.tl.mv{background:color-mix(in srgb,var(--accent) 55%,var(--panel2))}
.tl.key::after{content:'';position:absolute;left:50%;top:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 1.5px #1A1405}
.tl.cur{outline:2px solid var(--ink);outline-offset:0}
.tl i{position:absolute;left:50%;bottom:4px;width:7px;height:5px;margin-left:-3.5px;border-radius:50%;background:#F6F1E4;box-shadow:0 0 0 1px #3A2A18}
.tlnums{display:grid;grid-template-columns:repeat(20,1fr);font:600 10px/1 var(--body);color:var(--muted)}
.tlnums span{text-align:center}
.tlnums span:nth-child(1){grid-column:1}.tlnums span:nth-child(2){grid-column:5}.tlnums span:nth-child(3){grid-column:10}.tlnums span:nth-child(4){grid-column:15}.tlnums span:nth-child(5){grid-column:20}
.tlkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.tlkey span{display:inline-flex;align-items:center;gap:5px}
.tlkey b{width:12px;height:10px;border-radius:3px;display:inline-block;background:var(--panel2);outline:1px solid var(--line)}
.tlkey .sw2{background:color-mix(in srgb,var(--accent) 55%,var(--panel2))}
.tlkey .sw3{width:8px;height:8px;border-radius:50%;background:var(--accent);outline:1.5px solid #1A1405}
.tlkey .sw4{width:9px;height:6px;border-radius:50%;background:#F6F1E4;outline:1px solid #3A2A18}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.sline.bad{color:#FFB4A6}
.sline .fnum{color:var(--ink);font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.stp button{width:34px;height:32px;border:0;background:none;color:var(--ink);font:700 18px/1 var(--body)}
.stp button:active{background:var(--line);border-radius:999px}
.stp b{min-width:22px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.pass-link{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:24px;padding:8px 0 8px 14px;border-left:2px dashed var(--line);font-size:14px;color:var(--muted)}
.carry-row select{width:auto;flex:1;padding:8px 10px;font-size:15px}
.zoomhint{position:absolute;left:10px;bottom:8px;font:600 11px/1 var(--body);color:rgba(255,255,255,.55);pointer-events:none;letter-spacing:.04em}

.bench{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.bench .bl{font:700 11px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;padding:0 2px}
.bench button{flex:0 0 auto;width:52px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;border-radius:8px}
.bench button:active{background:var(--panel2)}
.bench small{font:600 10.5px/1.1 var(--body);color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mini{display:block}
.mini .num{font-family:var(--display);font-weight:800}

/* lists */
.section-h{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h:first-child{margin-top:4px}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.add-row .pos{grid-column:1}
input[type=text],input:not([type]),select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:84px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font:700 15px/1.1 var(--body)}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 50%,transparent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--panel2)}
.prow .who{flex:1;min-width:0}
.prow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:transparent;border:1.5px solid var(--muted)}
.badge{font:800 15px/1 var(--display);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.srow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.35fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow label{font-weight:600;font-size:14px;line-height:1.2}
.srow label small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.srow select{padding:8px 10px;font-size:15px}
.srow.unav select{border-color:color-mix(in srgb,var(--danger) 60%,transparent)}

/* moves */
.mcard{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.mcard .thumb{width:62px;height:88px;border-radius:6px;overflow:hidden;background:#1B4F27;border:0;padding:0}
.mcard .thumb svg{width:100%;height:100%;display:block}
.mcard .mbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.mname{font:800 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;background:none;border:0;padding:0;text-align:left}
.mdesc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mmeta{font-size:12px;color:var(--muted);letter-spacing:.03em}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.ed-head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.ed-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 4px}
.ed-title b{display:block;font:800 19px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:600;line-height:1.25}
.banner span{flex:1}
.banner .chip{background:rgba(0,0,0,.15);border-color:rgba(0,0,0,.25);color:var(--accent-ink)}
.transport{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.transport .icon-btn{width:38px;height:38px;flex:none}
.transport .play{background:var(--accent);color:var(--accent-ink)}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.fcount{font:800 17px/1 var(--display);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.fcount small{display:block;font:600 9.5px/1 var(--body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto;animation:up .18s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.sheet h2{margin:0;font:800 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.sheet p{margin:0}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.det-head{display:flex;gap:14px;align-items:center}
.det-head .who{display:flex;flex-direction:column;gap:5px;min-width:0}
.notes{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px}
.pill{display:inline-block;font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.pill.warn{color:#FFB4A6;border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw-def{height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font:600 13px/1 var(--body)}
.sw-def.on{outline:3px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pgrid button{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.pgrid button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel2))}
.pgrid button small{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid button:not(.on) svg{opacity:.45}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{display:block}
.opt small{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.code{font:12px/1.35 ui-monospace,Menlo,monospace;word-break:break-all;min-height:90px}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;align-items:center}
.trow .btn{flex:1;text-align:left}
.trow .btn.cur{outline:2px solid var(--accent)}
.sync-btn{position:relative}
.sync-btn .dot-badge{display:none;position:absolute;top:8px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sync-btn.dirty .dot-badge{display:block}
.sync-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sync-btn.spin svg{animation:none;opacity:.5}}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gate h1{margin:0;font:800 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.gate #gtCode,.gcode{font:800 24px/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.gcode{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all;-webkit-user-select:all}
.gate-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:8px 0 0}
.gate-or::before,.gate-or::after{content:'';flex:1;height:1px;background:var(--line)}
.lo{font-size:12px;color:var(--muted);font-weight:500}
.fmt{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px 12px}
.fmt b{display:inline-block;min-width:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90%;text-align:center}
</style>
</head>
<body>


<div id="app">
  <header class="topbar">
    <button class="team-btn" id="teamBtn" aria-label="Switch or rename team">
      <span class="tn" id="teamName">Team</span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn sync-btn" id="syncBtn" aria-label="Sync with your group" title="Sync" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 00.6-7.95A5.5 5.5 0 007.4 9.1 4.7 4.7 0 007 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path class="arr" d="M9.6 13.6a2.6 2.6 0 014.5-1.5M14.4 14.4a2.6 2.6 0 01-4.5 1.5M14.3 10.9v1.4h-1.4M9.7 17.1v-1.4h1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <i class="dot-badge"></i>
    </button>

function newTeam(name){ return {id:uid(), name:name||'New team', players:[], selection:{}, moves:[]}; }

}
function sampleMove(){
  const m = {id:uid(), name:'Crash ball 12', desc:'Off first-phase ball: 9 to 10, 10 hits 12 running a hard line off his inside shoulder. 13 holds width to fix the outside defender.', icons:{}};
  const P = {9:[[30,70],[31,66]], 10:[[24,75],[22,67]], 12:[[18,79],[23,56]], 13:[[11,82],[12,63]]};
  for(const n in P) m.icons[n] = {keys:{0:P[n][0], [LAST]:P[n][1]}, color:null};

/* ---------- move maths ---------- */
function keyList(ic){ return Object.keys(ic.keys).map(Number).sort((a,b)=>a-b); }

// ball.carry: [{p, f, pass}] — shirt p has the ball from frame f; the pass to them leaves the previous carrier `pass` frames earlier.
// p '' means the ball is let go at frame f (kick or loose ball) and follows its own keys again.
const BALL_OFF = [1.3, -1.3];

function heldPos(m, c, f){ if(!c || !c.p) return posAt(m.icons.ball, f); const q = posAt(m.icons[c.p], f); return [q[0]+BALL_OFF[0], q[1]+BALL_OFF[1]]; }

  for(const y of [10,110]) s += `<line x1="32.2" x2="37.8" y1="${y}" y2="${y}" stroke="#fff" stroke-width=".35"/><circle cx="32.2" cy="${y}" r=".55" fill="#fff"/><circle cx="37.8" cy="${y}" r=".55" fill="#fff"/>`;
  const T = (x,y,t,a='start') => `<text x="${x}" y="${y}" text-anchor="${a}" font-size="2.1" fill="rgba(255,255,255,.55)" font-family="Barlow,system-ui,sans-serif" font-weight="700">${t}</text>`;
  s += T(1,31.2,'22')+T(1,49.2,'10')+T(1,59.2,'½')+T(1,69.2,'10')+T(1,87.2,'22');
  s += T(35,5.8,'ATTACKING ↑','middle');
  return `<g class="lines">${s}</g><g class="layer"></g>`;
}

/* ---------- pitch gesture controller (drag icons, tap/double-tap, pan, pinch) ---------- */
function PitchCtl(svg, h){
  svg.innerHTML = pitchLines();
  const layer = svg.querySelector('.layer');
  const pts = new Map();
  const view = {cx:35, cy:60, z:null};
  let g = null, pinch = null;
  let last = {id:null, t:0}, tapTimer = null;
  const size = () => { const r = svg.getBoundingClientRect(); return [r.width, r.height, r.left, r.top]; };
  const fitZ = () => { const [W,H] = size(); return Math.min(W/78, H/128); };
  function apply(){
    const [W,H] = size(); if(!W || !H) return;
    const fz = fitZ(); if(!view.z || view.z < fz) view.z = fz; view.z = Math.min(view.z, fz*6);
    const w = W/view.z, hh = H/view.z;
    const fitX = (a,b,d,c) => { const mn=a+d/2, mx=b-d/2; return mn>mx ? c : clamp(view[c===35?'cx':'cy'], mn, mx); };
    view.cx = fitX(-4, 74, w, 35); view.cy = fitX(-4, 124, hh, 60);
    svg.setAttribute('viewBox', `${(view.cx-w/2).toFixed(3)} ${(view.cy-hh/2).toFixed(3)} ${w.toFixed(3)} ${hh.toFixed(3)}`);
  }
  function toSvg(cx,cy){ const [W,H,L,T] = size(); return [view.cx - W/view.z/2 + (cx-L)/view.z, view.cy - H/view.z/2 + (cy-T)/view.z]; }
  if('ResizeObserver' in window) new ResizeObserver(apply).observe(svg); else window.addEventListener('resize', apply);

  function tap(id){
    const now = performance.now();
    if(last.id === id && now - last.t < 330){ clearTimeout(tapTimer); last = {id:null,t:0}; h.doubleTap && h.doubleTap(id); }
    else { last = {id, t:now}; clearTimeout(tapTimer); tapTimer = setTimeout(()=>{ last={id:null,t:0}; h.tap && h.tap(id); }, 300); }
  }
  svg.addEventListener('pointerdown', e => {
    e.preventDefault();
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    if(pts.size === 2){
      if(g && g.kind==='icon' && g.dragging) h.dragEnd && h.dragEnd(g.id);
      g = null;
      const [a,b] = [...pts.values()];
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, z0: view.z, anchor: toSvg(mx,my)};
      return;
    }
    if(pts.size > 2) return;
    const [sx,sy] = toSvg(e.clientX, e.clientY);
    let id = h.pick ? h.pick(sx,sy) : null;
    let hx, hy;
    if(id){ hx = +id.x; hy = +id.y; id = id.id; }
    else { const hit = e.target.closest && e.target.closest('[data-hit]'); if(hit){ id = hit.dataset.hit; hx = +hit.dataset.x; hy = +hit.dataset.y; } }
    if(id) g = {kind:'icon', id, sx:e.clientX, sy:e.clientY, ox: sx-hx, oy: sy-hy, dragging:false, pid:e.pointerId};
    else g = {kind:'pan', sx:e.clientX, sy:e.clientY, cx0:view.cx, cy0:view.cy, dragging:false, pid:e.pointerId, at:[sx,sy]};
  });
  svg.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinch && pts.size >= 2){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      const [W,H,L,T] = size();
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      view.z = clamp(pinch.z0 * d / pinch.d0, fitZ(), fitZ()*6);
      view.cx = pinch.anchor[0] + W/view.z/2 - (mx-L)/view.z;
      view.cy = pinch.anchor[1] + H/view.z/2 - (my-T)/view.z;
      apply(); return;
    }
    if(!g || e.pointerId !== g.pid) return;
    if(!g.dragging && Math.hypot(e.clientX-g.sx, e.clientY-g.sy) > 7){ g.dragging = true; if(g.kind==='icon' && h.dragStart) h.dragStart(g.id); }
    if(!g.dragging) return;
    if(g.kind === 'icon'){
      const [x,y] = toSvg(e.clientX, e.clientY);
      h.drag && h.drag(g.id, r1(clamp(x-g.ox, -3, 73)), r1(clamp(y-g.oy, -3, 123)));
    } else {
      view.cx = g.cx0 - (e.clientX-g.sx)/view.z; view.cy = g.cy0 - (e.clientY-g.sy)/view.z; apply();
    }
  });
  function up(e, cancelled){
    if(!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if(pinch){ if(pts.size < 2){ pinch = null; g = null; } return; }
    if(!g || e.pointerId !== g.pid) return;
    const cur = g; g = null;
    if(cur.kind === 'icon'){
      if(cur.dragging) h.dragEnd && h.dragEnd(cur.id);
      else if(!cancelled) tap(cur.id);
    } else if(!cur.dragging && !cancelled){
      const now = performance.now();
      if(last.id === '__empty' && now - last.t < 330){ last = {id:null,t:0}; toggleZoom(cur.at); }
      else last = {id:'__empty', t:now};
    }
  }
  svg.addEventListener('pointerup', e => up(e,false));
  svg.addEventListener('pointercancel', e => up(e,true));
  function toggleZoom(at){ const fz = fitZ(); if(view.z > fz*1.3){ view.z = fz; } else { view.z = fz*2.4; view.cx = at[0]; view.cy = at[1]; } apply(); }
  return {
    layer, refresh: apply,
    fit(){ view.z = fitZ(); view.cx = 35; view.cy = 60; apply(); },
    isFit(){ return !view.z || view.z <= fitZ()*1.05; },
    focusBox(x0,y0,x1,y1){ const [W,H] = size(); if(!W) return false; const fz = fitZ(); view.z = clamp(Math.min(W/(x1-x0), H/(y1-y0)), fz, fz*3.2); view.cx = (x0+x1)/2; view.cy = (y0+y1)/2; apply(); return true; },
    focus(x,y,z){ view.z = fitZ()*z; view.cx = x; view.cy = y; apply(); },
    get scale(){ return view.z || 1; }
  };
}

/* ---------- sheets ---------- */
const sheetEl = $('#sheet'), backdrop = $('#backdrop');
let sheetOnClose = null;
function openSheet(html, mount, onClose){

}

function askConfirm(title, msg, okLabel, onOk){

function swatchRow(current, dflt){

function wireSwatches(el, fn){ $$('[data-color]', el).forEach(b => b.addEventListener('click', () => { $$('[data-color]', el).forEach(x=>x.classList.remove('on')); b.classList.add('on'); fn(b.dataset.color || null); })); }

function renderTeamPitch(){
  const t = team(); let out = '';
  for(const n of pitchNums(t)){ const [x,y] = teamPos(t,n); const p = playerAt(t,n); out += shirtSVG({x, y, n, color: colorOf(t,n), label: S.ui.names!==false ? (p ? surname(p.name) : '') : '', hit:'n:'+n}); }
  teamCtl.layer.innerHTML = out;
  $('#namesChip').classList.toggle('on', S.ui.names!==false);
}
function dualTap(onTap, onDouble){ let last={id:null,t:0}, timer; return id => { const now=performance.now(); if(last.id===id && now-last.t<330){ clearTimeout(timer); last={id:null,t:0}; onDouble(id); } else { last={id,t:now}; clearTimeout(timer); timer=setTimeout(()=>{ last={id:null,t:0}; onTap(id); },300); } }; }
const benchTap = dualTap(n => showSlot(n), n => editSlot(n));

function teamBox(){ const t = team(); let xs=[], ys=[]; for(const n of pitchNums(t)){ const [x,y] = teamPos(t,n); xs.push(x); ys.push(y); } return [Math.min(...xs)-6, Math.min(...ys)-6, Math.max(...xs)+6, Math.max(...ys)+8]; }

const b64u = bytes => { let s=''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };

async function encodeCode(obj){
  const json = JSON.stringify(obj);

}
async function decodeCode(text){
  text = String(text||'').trim();
  if(text.startsWith('{')) return JSON.parse(text);
  const m = text.match(/RTP([01])\.([A-Za-z0-9_-]+)/); if(!m) throw new Error('That is not a Rugby Team Picker code or link.');

    if(!('DecompressionStream' in window)) throw new Error('This browser is too old to open compressed codes. Update iOS and try again.');
    return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());

/* ---------- GROUP SYNC (Firebase, manual) ----------
   Everything is edited on the phone. Tapping Sync pulls the group's copy from Firestore, merges, and pushes.
   Each team (without its moves) and each move is one document holding its JSON. S.sync.base remembers the hash
   of every item at the last sync, so we can tell who changed what since then:
   - only this phone changed it → send it; only the group changed it → take theirs;
   - both changed a move → keep both (ours becomes "(my version)"); both changed a team's squad/sheet → ask.
   Teams marked localOnly never leave the phone. Talks to Firebase over REST, so no SDK is needed.
   Groups are created by the admin in the Firebase console (see README); the app can only join them. */
const FB = {apiKey:'AIzaSyBjRwmW1c-Y5V05NzSuEqOMAjMRUo3ZZV4', projectId:'rugbyteam'}; // from Firebase console → Project settings → Your apps → Web app config
const fbOn = () => !!(FB.apiKey && FB.projectId);
const DOCS = () => `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const DOCNAME = path => `projects/${FB.projectId}/databases/(default)/documents/${path}`;
const normCode = c => String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const fmtCode = c => String(c||'').replace(/^(.{4})(.{4})(.*)$/, '$1-$2-$3');
function hashStr(s){ let h = 0x811c9dc5; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h>>>0).toString(36) + '.' + s.length.toString(36); }
const syncing = () => !!(S.sync && S.sync.group);

async function fbErr(r){ try { const j = await r.json(); return (j.error && (j.error.message || j.error.status)) || 'HTTP '+r.status; } catch(e){ return 'HTTP '+r.status; } }
async function fbToken(){
  const z = S.sync = S.sync || {};
  if(z.token && z.tokenExp > Date.now() + 60000) return z.token;
  if(z.refresh){
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(z.refresh)});
    if(r.ok){ const j = await r.json(); z.token = j.id_token; z.refresh = j.refresh_token; z.tokenExp = Date.now() + (+j.expires_in)*1000; save(); return z.token; }
  }
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"returnSecureToken":true}'});
  if(!r.ok) throw new Error('Could not sign in: ' + await fbErr(r));
  const j = await r.json(); z.token = j.idToken; z.refresh = j.refreshToken; z.tokenExp = Date.now() + (+j.expiresIn)*1000; save(); return z.token;
}
async function fb(method, path, body){
  const tok = await fbToken();
  const r = await fetch(DOCS() + path, {method, headers:{'Authorization':'Bearer '+tok, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if(r.status===404 && method==='GET') return null;
  if(!r.ok){ const e = new Error(await fbErr(r)); e.status = r.status; throw e; }
  return r.json();
}
const niceErr = e => /fetch|network|load failed/i.test(e.message||'') ? 'No connection. Try again when you have signal.' : (e.message || 'Something went wrong');

async function fetchGroup(code){ const d = await fb('GET', '/groups/'+code); return d ? {code, name: d.fields.name.stringValue} : null; }
async function listItems(code){
  const out = {}; let page = '';
  do {
    const j = await fb('GET', `/groups/${code}/items?pageSize=300${page?'&pageToken='+encodeURIComponent(page):''}`) || {};
    for(const d of j.documents||[]){ const f = d.fields||{}, id = d.name.split('/').pop();
      out[id] = {kind: f.kind && f.kind.stringValue, teamId: f.teamId && f.teamId.stringValue, json: f.json ? f.json.stringValue : '', deleted: !!(f.deleted && f.deleted.booleanValue), by: f.by ? f.by.stringValue : '', updateTime: d.updateTime}; }
    page = j.nextPageToken;
  } while(page);
  return out;
}
function localItems(){
  const out = {};
  for(const t of S.teams){ if(t.localOnly) continue;
    const core = Object.assign({}, t); delete core.moves; delete core.localOnly;
    out['t_'+t.id] = {kind:'team', teamId:t.id, json: JSON.stringify(core)};
    for(const m of t.moves) out['m_'+t.id+'_'+m.id] = {kind:'move', teamId:t.id, json: JSON.stringify(m)};
  }
  return out;
}
const itemTeam = id => id.startsWith('t_') ? id.slice(2) : id.slice(2, id.indexOf('_', 2));
function pendingChanges(){
  if(!syncing()) return 0;
  const base = S.sync.base || {}, loc = localItems(), localOnly = new Set(S.teams.filter(t => t.localOnly).map(t => t.id)); let n = 0;
  for(const id in loc) if(hashStr(loc[id].json) !== base[id]) n++;
  for(const id in base) if(!loc[id] && !localOnly.has(itemTeam(id))) n++;
  return n;
}

// choices: {teamId: 'mine'|'theirs'} for teams changed on both sides. Returns {needs:[...]} when a choice is required.
async function syncNow(choices = {}, retry = true){
  const z = S.sync, code = z.group, remote = await listItems(code), local = localItems(), base = z.base || {};
  const localOnly = new Set(S.teams.filter(t => t.localOnly).map(t => t.id));
  const ids = [...new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(base)])].filter(id => !localOnly.has(itemTeam(id)));
  const live = id => remote[id] && !remote[id].deleted ? remote[id] : null;
  const decide = id => {
    const L = local[id], R = live(id), B = base[id] || null;
    const lh = L ? hashStr(L.json) : null, rh = R ? hashStr(R.json) : null;
    if(lh === rh) return 'same';
    const lc = lh !== B, rc = rh !== B;
    if(lc && !rc) return 'push';
    if(rc && !lc) return 'pull';
    if(!L) return 'pull'; if(!R) return 'push'; // edited on one side, deleted on the other: keep the edit
    return 'both';
  };
  const push = [], pull = [], copies = [], needs = [], newBase = {};
  const keep = id => { if(local[id]) newBase[id] = hashStr(local[id].json); };
  // teams first: a team brought back keeps all its moves; a deleted team takes its moves with it
  const keepTeams = new Set(), dropTeams = new Set();
  for(const id of ids.filter(i => i.startsWith('t_'))){
    let d = decide(id); const tid = itemTeam(id);
    if(d==='both'){ const c = choices[tid]; if(!c){ needs.push({teamId:tid, name: JSON.parse(local[id].json).name, by: remote[id].by}); continue; } d = c==='mine' ? 'push' : 'pull'; }
    if(d==='same'){ keep(id); continue; }
    if(d==='push' && remote[id] && remote[id].deleted) keepTeams.add(tid);
    if((d==='push' && !local[id]) || (d==='pull' && !live(id))) dropTeams.add(tid);
    (d==='push' ? push : pull).push(id);
  }
  if(needs.length) return {needs};
  for(const id of ids.filter(i => i.startsWith('m_'))){
    const tid = itemTeam(id);
    if(dropTeams.has(tid)){ if(local['t_'+tid]) pull.push(id); else if(live(id)) push.push(id); continue; }
    let d = decide(id);
    if(keepTeams.has(tid) && local[id]) d = 'push';
    if(d==='same'){ keep(id); continue; }
    if(d==='both'){ pull.push(id); copies.push(id); continue; }
    (d==='push' ? push : pull).push(id);
  }
  // each write carries a precondition, so if someone syncs in between this run starts again instead of overwriting them
  const who = z.who || '', now = String(Date.now()), writes = [];
  const write = (id, item) => {
    const Rd = remote[id], fields = {kind:{stringValue: id.startsWith('t_') ? 'team' : 'move'}, teamId:{stringValue: itemTeam(id)}, json:{stringValue: item ? item.json : ''},
      deleted:{booleanValue: !item}, by:{stringValue: who}, at:{integerValue: now}};
    writes.push({update:{name: DOCNAME(`groups/${code}/items/${id}`), fields}, currentDocument: Rd ? {updateTime: Rd.updateTime} : {exists:false}});
  };
  for(const id of push){ write(id, local[id]); keep(id); }
  // a move changed on both sides: theirs keeps the name, ours is saved alongside as "(my version)" so nothing is lost
  const copyMoves = [];
  for(const id of copies){ const tid = itemTeam(id), m = JSON.parse(local[id].json); m.id = uid(); m.name += ' (my version)';
    const nid = 'm_'+tid+'_'+m.id, item = {kind:'move', teamId:tid, json: JSON.stringify(m)};
    write(nid, item); newBase[nid] = hashStr(item.json); copyMoves.push({tid, m}); }
  try { for(let i=0;i<writes.length;i+=400) await fb('POST', ':commit', {writes: writes.slice(i, i+400)}); }
  catch(e){ if(retry && (e.status===409 || e.status===400 || /FAILED_PRECONDITION|ABORTED/.test(e.message))) return syncNow(choices, false); throw e; }
  // apply what came from the group: teams, then their moves
  let got = 0;
  for(const id of pull.filter(i => i.startsWith('t_'))){
    const R = live(id), tid = itemTeam(id), i = S.teams.findIndex(t => t.id===tid);
    if(!R){ if(i>=0){ S.teams.splice(i,1); got++; } continue; }
    const t = Object.assign({}, JSON.parse(R.json), {moves: i>=0 ? S.teams[i].moves : []});
    if(i>=0) S.teams[i] = t; else S.teams.push(t); newBase[id] = hashStr(R.json); got++;
  }
  for(const id of pull.filter(i => i.startsWith('m_'))){
    const R = live(id), tid = itemTeam(id), t = S.teams.find(x => x.id===tid); if(!t) continue;
    const mid = id.slice(3 + tid.length), i = t.moves.findIndex(m => m.id===mid);
    if(!R){ if(i>=0){ t.moves.splice(i,1); got++; } continue; }
    const m = JSON.parse(R.json); if(i>=0) t.moves[i] = m; else t.moves.unshift(m); newBase[id] = hashStr(R.json); got++;
  }
  for(const {tid, m} of copyMoves){ const t = S.teams.find(x => x.id===tid); if(t) t.moves.unshift(m); }
  if(!S.teams.length) S.teams.push(Object.assign(newTeam('My team'), {localOnly:true}));
  if(!S.teams.some(t => t.id===S.currentTeamId)) S.currentTeamId = S.teams[0].id;
  if(ME.moveId && !team().moves.some(m => m.id===ME.moveId)){ ME.moveId = null; ME.editing = null; }
  z.base = newBase; z.lastSync = Date.now(); save();
  return {sent: push.length + copyMoves.length, got, copies: copyMoves.length};
}

let SYNCING = false;
async function runSync(choices){
  if(SYNCING) return; SYNCING = true; $('#syncBtn').classList.add('spin');
  try {
    const r = await syncNow(choices);
    if(r.needs){ SYNCING = false; askTeamConflicts(r.needs, choices || {}); return; }
    stopPlay(); renderAll();
    toast(r.sent || r.got ? `Synced · ${r.sent} sent, ${r.got} received${r.copies ? ` · ${r.copies} move${r.copies>1?'s':''} kept as “my version”` : ''}` : 'Up to date');
  } catch(e){
    // the admin removed the group: say so rather than showing a permissions error
    let gone = false; if(e.status===403){ try { gone = !(await fetchGroup(S.sync.group)); } catch(_){} }
    toast(gone ? 'This group no longer exists. Ask your head coach for the new code (team menu → Group → Leave group).' : niceErr(e));
  }
  finally { SYNCING = false; $('#syncBtn').classList.remove('spin'); syncDot(); }
}
function askTeamConflicts(needs, choices){

}
function syncDot(){

}
const ago = t => { if(!t) return 'never'; const s = (Date.now()-t)/1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s/60)+' min ago' : s < 86400 ? Math.round(s/3600)+' h ago' : new Date(t).toLocaleDateString('en-GB'); };
$('#syncBtn').addEventListener('click', () => syncing() ? runSync() : showGate(true));

// Join or create a group. Shown on first open (a code is needed to use the app) and after leaving a group.
function showGate(canClose){

  g.innerHTML = `<div class="gate-in">

    <div class="field"><label class="field-label" for="gtCode">Group code</label><input id="gtCode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH-JK" value="${pre ? fmtCode(pre) : ''}"></div>
    <div class="field"><label class="field-label" for="gtWho">Your name</label><input id="gtWho" type="text" placeholder="Shown to your group, e.g. Chris" value="${esc((S.sync||{}).who||'')}"></div>

// On joining, choose which of this phone's teams go to the group. Samples, and names the group already has, start unticked.

  const mine = S.teams.filter(t => !remote['t_'+t.id]);
  if(!mine.length){ runSync(); return; }
  openSheet(`<div class="eyebrow">${esc(S.sync.groupName)}</div><h2>Share your teams?</h2>
    <p class="muted">Ticked teams go to the group when you sync. Unticked teams stay on this phone only, and you can share them later from the team menu.</p>
    <div class="opts">${mine.map(t => { const dup = groupNames.has(baseName(t.name)), sample = /\(sample\)/i.test(t.name);
      return `<label class="opt"><input type="checkbox" data-up="${t.id}"${dup||sample?'':' checked'}><span><b>${esc(t.name)}</b><small>${t.players.length} players, ${t.moves.length} moves${dup?' · the group already has a team with this name':''}${sample?' · sample data':''}</small></span></label>`; }).join('')}</div>
    <button class="btn wide" id="upGo">Sync now</button>`,
    el => $('#upGo', el).addEventListener('click', () => { $$('[data-up]', el).forEach(c => { const t = S.teams.find(x => x.id===c.dataset.up); if(t) t.localOnly = !c.checked; }); save(); closeSheet(); runSync(); }));
}
function showGroup(){
  const z = S.sync, n = pendingChanges(), link = linkBase() + '#join=' + fmtCode(z.group);
  openSheet(`<div class="eyebrow">Your group</div><h2>${esc(z.groupName)}</h2>
    <div class="field"><div class="field-label">Group code</div><div class="gcode">${fmtCode(z.group)}</div></div>
    <p class="muted">Last synced ${ago(z.lastSync)}. ${n ? `${n} change${n>1?'s':''} on this phone not sent yet.` : 'No changes waiting to be sent.'}</p>
    <div class="row-btns"><button class="btn" id="gpSync">Sync now</button><button class="btn ghost" id="gpInvite">Invite a coach</button></div>
    <div class="field"><label class="field-label" for="gpWho">Your name in the group</label><div class="add-row"><input id="gpWho" type="text" value="${esc(z.who||'')}"><button class="btn ghost" id="gpWhoSave">Save</button></div></div>
    <button class="btn danger" id="gpLeave">Leave group</button>
    <p class="hint">Anyone with the code can see and change the group's teams, so only give it to your coaches.</p>`,
    el => {
      $('#gpSync', el).addEventListener('click', () => { closeSheet(); runSync(); });
      $('#gpInvite', el).addEventListener('click', async () => {
        const text = `Join ${z.groupName} in Rugby Team Picker. Open this link, or enter code ${fmtCode(z.group)}: ${link}`;
        try { if(canShare()) await navigator.share({title: z.groupName, text}); else { await navigator.clipboard.writeText(text); toast('Invite copied'); } } catch(e){ if(e.name!=='AbortError') toast('Code: '+fmtCode(z.group)); }
      });
      $('#gpWhoSave', el).addEventListener('click', () => { z.who = $('#gpWho', el).value.trim() || z.who; save(); toast('Name saved'); });
      $('#gpLeave', el).addEventListener('click', () => askConfirm('Leave '+z.groupName+'?', 'Your teams stay on this phone but stop syncing. You need the code to join again.', 'Leave group', () => {
        S.sync = {who: z.who}; save(); syncDot(); showGate(false);
      }));
    });
}

/* ---------- boot ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
if(ME.moveId === null && S.ui.tab === 'moves') {}
showTab(TAB);
checkLinkImport();
window.addEventListener('hashchange', checkLinkImport);
if('serviceWorker' in navigator && location.protocol==='https:' && !INFRAME){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
syncDot();
function checkJoinLink(){ if(fbOn() && /join=/.test(location.hash)) showGate(syncing()); }
if(fbOn() && !syncing()) showGate(false); else checkJoinLink();
window.addEventListener('hashchange', checkJoinLink);
window.__rtp = {get S(){return S;}, ME, encodeCode, decodeCode, handleImport, posAt, FB, runSync, showGate};
})();
</script>

</body>

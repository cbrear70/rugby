<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Picker">
<meta name="theme-color" content="#0E1712">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Rugby Team Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0E1712; --panel:#15231B; --panel2:#1C2E23; --line:#2A4032;
  --ink:#EDF3EE; --muted:#95AA9B; --accent:#F2C230; --accent-ink:#1A1405; --danger:#E4573F; --ok:#5BC77A; --still:#000000; --jog:#2F7CF0; --run:#D92D2D; --sprint:#F2C230; /* timeline speeds */
  --display:"Saira Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --body:"Barlow",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* top bar */
.topbar{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 16px;border-bottom:1px solid var(--line)}
.team-btn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;text-align:left}
.team-btn .tn{font:800 23px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-btn svg{flex:none;opacity:.7}
.tn-wrap{display:flex;flex-direction:column;min-width:0}
.gn{align-self:flex-start;max-width:100%;display:inline-flex;align-items:center;gap:6px;margin-bottom:3px;padding:3px 9px 3px 7px;border-radius:999px;font:700 11px/1.1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--gc);background:color-mix(in srgb,var(--gc) 18%,transparent);border:1px solid color-mix(in srgb,var(--gc) 45%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn::before,.gdot{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--gc)}
.gdot{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:1px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--gc) 45%,var(--line));border-left:6px solid var(--gc);background:color-mix(in srgb,var(--gc) 12%,var(--panel2));color:var(--ink)}
.gcard .eyebrow{color:var(--gc)}
.gcard b{font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.gcard small{color:var(--muted);font-size:13px}
.teams-in{margin-left:14px;padding-left:12px;border-left:3px solid var(--gc);display:flex;flex-direction:column;gap:10px}
.teams-in h2{font-size:22px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:10px;color:var(--ink)}
.icon-btn:active{background:var(--panel2)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel)}
.tabbar button{background:none;border:0;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.kstate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}.kstate small::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}.kstate.on small::before{background:var(--ok,#5BC77A)}.kstate.wait small::before{background:var(--accent)}.kstate.off small::before{background:var(--danger,#E4573F)}
.evcard.cancelled .evtitle{text-decoration:line-through;opacity:.7}
.mem.upd b{white-space:normal;overflow:visible;text-overflow:clip}
.hint a,.muted a{color:var(--accent)}
.tabbar button{position:relative}.tabbar button.tabdot::after{content:'';position:absolute;top:5px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* pitch */
.toolrow{display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap;align-items:center}
#v-pitch .toolrow,#adminTabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#v-pitch .toolrow>*,#adminTabs>*{flex:none}#adminTabs:empty{display:none}.chip .cnt{display:inline-block;min-width:16px;margin-left:5px;padding:1px 4px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;text-align:center}.chip.on .cnt{background:var(--accent-ink);color:var(--accent)}.chip .cnt:empty{display:none}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 13px/1.1 var(--body)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:active{filter:brightness(1.2)}
.toolrow .spacer{flex:1}
.pitch-wrap{flex:1;min-height:0;position:relative;background:#1B4F27}
.pitch{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pitch .num{font-family:var(--display);font-weight:800}
.pitch .lbl{font-family:var(--body);font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:1.2px;stroke-linejoin:round}
.pitch .tok{cursor:grab}
.pitch .tok.dim{opacity:.3}
.pitch .tok.ghost{opacity:.55}
.pitch .path{fill:none;stroke-width:.45;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.pitch .path.dim{opacity:.15}
.pitch .path.ed{stroke-width:.6;opacity:1}
.pitch .fdot{fill:rgba(255,255,255,.25);stroke:#fff;stroke-width:.22;pointer-events:none} /* dots are picked by position, so taps pass through to the shirt */
.pitch .path{pointer-events:none}
.pitch .fdot.key{fill:var(--accent);stroke:#1A1405}
.pitch .path.runsel{fill:none;stroke:#fff;stroke-width:1.1;opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.pitch .fdot.out{opacity:.3}
.banner-runs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.banner .banner-runs .chip.on{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.tl.insel{box-shadow:inset 0 -4px 0 #fff}
.runtabs{display:flex;flex-wrap:wrap;gap:6px}
.pitch .fdot.sp0{fill:var(--still);stroke:#fff}
.pitch .fdot.sp1{fill:var(--jog)}
.pitch .fdot.sp2{fill:var(--run)}
.pitch .fdot.sp3{fill:var(--sprint)}
.pitch .fdot.key{stroke:#fff;stroke-width:.45}
.pitch .fdot.cur{stroke:#fff;stroke-width:.45;fill:#fff}
.pitch .fdot.key.cur{fill:var(--accent);stroke:#fff}
.pitch .pdot{stroke:none}
.pitch .fdot.held{fill:none;stroke:rgba(255,255,255,.45);stroke-width:.15}
.pitch .fdot.held.cur{stroke:#fff;stroke-width:.3}
.carry-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.chain{display:flex;flex-direction:column}
.step{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.step.warn{border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.step-top{display:flex;gap:8px;align-items:center}
.step-top select{flex:1;width:auto;min-width:0;padding:8px 10px;font-size:15px}
.sbtn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0}
.sbtn:disabled{opacity:.3}
.sbtn:active{background:var(--line)}
.sbtn.del{color:var(--danger)}
.pass-link .ins{margin-left:auto}
.vtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vrow{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.vrow:last-child{border-bottom:0}
.vhead{background:none;padding:6px 12px;font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vhead span{text-align:center}
.vwho{display:flex;align-items:center;gap:10px;min-width:0}
.vwho b{display:block;font-weight:600}
.vwho small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtg{display:grid;place-items:center;height:36px}
.vtg input{width:24px;height:24px;accent-color:var(--accent)}
.vtg input:disabled{opacity:.35}
.tlwrap{display:flex;flex-direction:column;gap:3px}
.tlgrid{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;row-gap:4px}
.tlgrid.paint{touch-action:none}
.tl.pv{outline:2px solid #fff;outline-offset:-2px}
.tl.pv0{background:var(--still)} .tl.pv1{background:var(--jog)} .tl.pv2{background:var(--run)} .tl.pv3{background:var(--sprint)}
.brushes{gap:6px}
.chip.brush::before{content:'';display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;outline:1px solid rgba(255,255,255,.35)}
.chip.brush.sp0::before{background:var(--still)} .chip.brush.sp1::before{background:var(--jog)} .chip.brush.sp2::before{background:var(--run)} .chip.brush.sp3::before{background:var(--sprint)}
.chip.brush.sp0.on{background:var(--still);border-color:#fff;color:#fff}
.chip.brush.sp1.on{background:var(--jog);border-color:var(--jog);color:#fff}
.chip.brush.sp2.on{background:var(--run);border-color:var(--run);color:#fff}
.chip.brush.sp3.on{background:var(--sprint);border-color:var(--sprint);color:#1A1405}
.tl{height:30px;border:0;border-radius:4px;background:var(--panel2);padding:0;position:relative;outline:1px solid var(--line);outline-offset:-1px}
.tl.mv{background:color-mix(in srgb,var(--accent) 55%,var(--panel2))}
.tl.sp0{background:var(--still)}
.tl.sp1{background:var(--jog)}
.tl.sp2{background:var(--run)}
.tl.sp3{background:var(--sprint)}
.tlkey .sw1{background:var(--still)}
.tlkey .sw2.j{background:var(--jog)}
.tlkey .sw2.r{background:var(--run)}
.tlkey .sw2.s{background:var(--sprint)}
.chip.spd.sp1.on{background:var(--jog);border-color:var(--jog);color:#fff}
.chip.spd.sp2.on{background:var(--run);border-color:var(--run);color:#fff}
.chip.spd.sp3.on{background:var(--sprint);border-color:var(--sprint);color:#1A1405}
.tl.key::after{content:'';position:absolute;left:50%;top:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #000}
.tl.cur{outline:2px solid var(--ink);outline-offset:0}
.tl.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:1}
.tlact{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.tlact-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--muted)}
.tlact-h b{color:var(--ink)}
.tlact-h .chip{margin-left:auto}
.btn.sm{padding:6px 10px;font-size:13px}
.tl i{position:absolute;left:50%;bottom:4px;width:7px;height:5px;margin-left:-3.5px;border-radius:50%;background:#F6F1E4;box-shadow:0 0 0 1px #3A2A18}
.tlnums{display:grid;grid-template-columns:repeat(20,1fr);font:600 10px/1 var(--body);color:var(--muted)}
.tlnums span{text-align:center}
.tlnums span:nth-child(1){grid-column:1}.tlnums span:nth-child(2){grid-column:5}.tlnums span:nth-child(3){grid-column:10}.tlnums span:nth-child(4){grid-column:15}.tlnums span:nth-child(5){grid-column:20}
.runs{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.runs b{color:var(--ink);margin-right:4px}
.addrun{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.tlkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.tlkey span{display:inline-flex;align-items:center;gap:5px}
.tlkey b{width:12px;height:10px;border-radius:3px;display:inline-block;background:var(--panel2);outline:1px solid var(--line)}
.tlkey .sw2{background:color-mix(in srgb,var(--accent) 55%,var(--panel2))}
.tlkey .sw3{width:8px;height:8px;border-radius:50%;background:#fff;outline:1.5px solid #000}
.tlkey .sw4{width:9px;height:6px;border-radius:50%;background:#F6F1E4;outline:1px solid #3A2A18}
.sline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.sline.bad{color:#FFB4A6}
.sline .fnum{color:var(--ink);font-variant-numeric:tabular-nums}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.stp button{width:34px;height:32px;border:0;background:none;color:var(--ink);font:700 18px/1 var(--body)}
.stp button:active{background:var(--line);border-radius:999px}
.stp b{min-width:22px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.stp input.stpin{width:42px;min-width:0;padding:4px 0;border:0;border-radius:6px;background:var(--panel2);color:var(--ink);text-align:center;font:700 16px/1 var(--body);font-variant-numeric:tabular-nums}
.stp input.stpin:focus{outline:2px solid var(--accent)}
.pass-link{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-left:24px;padding:8px 0 8px 14px;border-left:2px dashed var(--line);font-size:14px;color:var(--muted)}
.carry-row select{width:auto;flex:1;padding:8px 10px;font-size:15px}
.zoomhint{position:absolute;left:10px;bottom:8px;font:600 11px/1 var(--body);color:rgba(255,255,255,.55);pointer-events:none;letter-spacing:.04em}

.bench{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.bench .bl{font:700 11px/1 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;padding:0 2px}
.bench button{flex:0 0 auto;width:52px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;border-radius:8px}
.bench button:active{background:var(--panel2)}
.bench small{font:600 10.5px/1.1 var(--body);color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mini{display:block}
.mini .num{font-family:var(--display);font-weight:800}

/* lists */
.section-h{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h:first-child{margin-top:4px}
.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.add-row .pos{grid-column:1}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=search],input:not([type]),select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:84px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font:700 15px/1.1 var(--body)}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 50%,transparent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--panel2)}
.prow .who{flex:1;min-width:0}
.prow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{color:var(--muted);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:transparent;border:1.5px solid var(--muted)}
.badge{font:800 15px/1 var(--display);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.srow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.35fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow label{font-weight:600;font-size:14px;line-height:1.2}
.srow label small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.srow select{padding:8px 10px;font-size:15px}
.srow.unav select{border-color:color-mix(in srgb,var(--danger) 60%,transparent)}

/* moves */
.mcard{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.cattabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.cattabs button{border:0;border-radius:9px;padding:9px 2px;background:none;color:var(--muted);font:700 12.5px/1.1 var(--body);letter-spacing:.03em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}
.cattabs button small{font:600 11px/1 var(--body);opacity:.8}
.cattabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.pitch .cone{cursor:grab}
.pitch .cone.dim{opacity:.45}
.cones-pick{display:flex;flex-wrap:wrap;gap:6px}
.conechip i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;outline:1px solid rgba(0,0,0,.4)}
.mcard.draft{border-style:dashed;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
/* players and parents: watch shared drills, nothing else */
.tabbar{grid-template-columns:repeat(var(--tabs,5),1fr)!important}.tabbar.many button{font-size:9.5px;letter-spacing:.02em}
.hats{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.hatrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:12px;padding:10px 12px}
.hatrow.cur{outline:2px solid var(--gc)}.hatrow b{font-size:17px}.hatrow small{color:var(--muted);font-size:12.5px}
.hatrole{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gc)}
.selchip{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.viewer #edPlayers, body.viewer #edBanner, body.viewer #edPasses,
body.viewer #edCones, body.viewer #edState, body.viewer #edHint{display:none!important}
.mem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
/* Help (coaches and admins only) */
.help details{border-bottom:1px solid var(--line)}
.help summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:'+';flex:none;width:14px;color:var(--muted)}
.help details[open] summary::before{content:'\2212'}
.help summary small{margin-left:auto;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.help .hbody{padding:0 0 12px 22px;font-size:14px;line-height:1.45}
.help .hbody ol,.help .hbody ul{margin:6px 0;padding-left:20px}
.help .hbody p{margin:6px 0}
#hlpQ{width:100%;margin:4px 0 6px}
.sreq{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sreq .stag{font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sreq .stag.open{color:var(--accent)}
.sreq p{margin:4px 0;white-space:pre-wrap}
.sreq .sreply{margin-top:6px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 8px 8px 0;white-space:pre-wrap}
.warnbox{padding:10px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--danger) 55%,var(--line));font-size:14px}
.mem>div,.mem>.memlink{flex:1;min-width:0}.mem>.selstack{flex:none;display:flex;flex-direction:column;gap:4px;width:42%;max-width:190px}.selstack select{width:100%}.plpick{background:none;border:0;padding:6px 0;color:var(--ink);font:600 15px/1.2 var(--body);text-align:left;cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.memlink{text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}.memlink small u{text-decoration-color:var(--muted)}.mem b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mem small{display:block;color:var(--muted);font-size:12px}
.mem select{width:auto;min-width:0;padding:6px 8px}.mem.req{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:8px}
.rcode{display:flex;align-items:center;gap:8px;margin:6px 0}.rcode .gcode{flex:1;font-size:18px}
/* fixtures */
.fixbar{margin:0 0 6px}
.evcard{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:14px;padding:12px;margin-bottom:10px}
.evcard.ev-match{border-left-color:var(--accent)}.evcard.ev-training{border-left-color:var(--jog)}
.evdate{flex:none;width:50px;text-align:center;border-radius:10px;background:var(--panel2);padding:6px 0;align-self:flex-start}
.evdate small{display:block;font:700 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.evdate b{display:block;font:800 26px/1.05 var(--display)}
.evbody{flex:1;min-width:0}
.evtitle{display:block;font-weight:700;font-size:17px;line-height:1.25;background:none;border:0;padding:0;text-align:left}
.evmeta{color:var(--muted);font-size:13px;margin-top:2px}.evtag{font-weight:700}
.avsum{display:block;background:none;border:0;padding:0;margin-top:6px;font-size:13px;color:var(--muted);text-align:left}
.st-yes{color:var(--ok)}.st-maybe{color:#E8C547}.st-no{color:#FF8A7A}
.avrow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}.avrow>span{flex-basis:100%;font-weight:600;font-size:14px}.avrow .avb{flex:1}
.avb{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font:600 13px/1 var(--body)}
.avb.on.yes{background:var(--ok);border-color:var(--ok);color:#06240F}.avb.on.maybe{background:#E8C547;border-color:#E8C547;color:#221A00}.avb.on.no{background:var(--danger);border-color:var(--danger);color:#fff}
.tpill{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;border:1px solid var(--gc);color:var(--gc);margin-bottom:5px}
.tchip .gdot{margin-right:6px}
.stag{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:color-mix(in srgb,var(--sc) 22%,transparent);color:var(--ink);border:1px solid var(--sc);vertical-align:1px}
.sdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--sc)}
.subhead{display:flex;align-items:center;gap:8px;justify-content:flex-start}.subhead .sdot{width:10px;height:10px}
.kid{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:14px;padding:12px;margin:10px 0}
.kidhead{display:flex;align-items:center;gap:8px;justify-content:space-between}.kidhead b{font-size:17px}.kid .tpill{margin:0}
.kidlinks{margin:4px 0 6px;color:var(--muted)}.pick{font-size:14px;margin:2px 0}.pick b{color:var(--accent)}
.hint.err{color:#FFB4A6}
.scorerow{display:flex;align-items:center;gap:10px;margin:4px 0}.scorerow span{flex:1}.scorerow b{min-width:28px;text-align:center;font-size:18px}
.result{font-weight:700;color:var(--accent)}.closed{font-size:12px;color:var(--muted)}
.testas{display:inline-block;background:var(--danger);color:#fff;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.evnote{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.evtimes{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.maprow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:6px}.maprow .field-label{margin:0}
.implist{padding-left:18px;margin:6px 0 12px}.implist li{margin-bottom:6px}
.srow small.st-yes,.srow small.st-maybe,.srow small.st-no{color:inherit}.srow .avtag{display:block;font-weight:600;font-size:12px}
.dtag.pl{color:var(--muted);border-color:var(--line)}
.dtag{display:inline-block;font:700 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:999px;padding:2px 6px;margin-right:2px;vertical-align:1px}
.mcard .thumb{width:62px;height:88px;border-radius:6px;overflow:hidden;background:#1B4F27;border:0;padding:0}
.mcard .thumb svg{width:100%;height:100%;display:block}
.mcard .mbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.mname{font:800 20px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;background:none;border:0;padding:0;text-align:left}
.mdesc{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mmeta{font-size:12px;color:var(--muted);letter-spacing:.03em}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.ed-head{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
.ed-title{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 4px}
.ed-title b{display:block;font:800 19px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-title small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:600;line-height:1.25}
.banner span{flex:1}
.banner .chip{background:rgba(0,0,0,.15);border-color:rgba(0,0,0,.25);color:var(--accent-ink)}
.banner.lapsed{background:var(--danger);color:#fff}
.transport{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.transport .icon-btn{width:38px;height:38px;flex:none}
.transport .play{background:var(--accent);color:var(--accent-ink)}
.transport input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.fcount{font:800 17px/1 var(--display);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.fcount small{display:block;font:600 9.5px/1 var(--body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:760px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86%;overflow-y:auto;animation:up .18s ease-out;display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 2px}
.sheet h2{margin:0;font:800 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.sheet p{margin:0}
.eyebrow{font:700 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.det-head{display:flex;gap:14px;align-items:center}
.det-head .who{display:flex;flex-direction:column;gap:5px;min-width:0}
.notes{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px}
.pill{display:inline-block;font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.pill.warn{color:#FFB4A6;border-color:color-mix(in srgb,var(--danger) 60%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw-def{height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);padding:0 12px;font:600 13px/1 var(--body)}
.sw-def.on{outline:3px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 auto}
.hint{font-size:13px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pgrid button{aspect-ratio:1;max-width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.pgrid button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--panel2))}
.pgrid button small{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid button:not(.on) svg{opacity:.45}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt b{display:block}
.opt small{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.code{font:12px/1.35 ui-monospace,Menlo,monospace;word-break:break-all;min-height:90px}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:8px;align-items:center}
.trow .btn{flex:1;text-align:left}
.trow .btn.cur{outline:2px solid var(--accent)}
.sync-btn{position:relative}
.sync-btn .dot-badge{display:none;position:absolute;top:8px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.sync-btn.dirty .dot-badge{display:block}
.sync-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sync-btn.spin svg{animation:none;opacity:.5}}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gate h1{margin:0;font:800 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.gate #gtCode,.gcode{font:800 24px/1.1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.gcode{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all;-webkit-user-select:all}
.gate-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:8px 0 0}
.gate-or::before,.gate-or::after{content:'';flex:1;height:1px;background:var(--line)}
.lo{font-size:12px;color:var(--muted);font-weight:500}
.fmt{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:10px;padding:10px 12px}
.fmt b{display:inline-block;min-width:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90%;text-align:center}
</style>
</head>
<body>


<div id="app">
  <header class="topbar">
    <button class="team-btn" id="teamBtn" aria-label="Switch or rename selection">
      <span class="tn-wrap"><small class="gn" id="groupName" hidden></small><small class="testas" id="testAs" hidden></small><span class="tn" id="teamName">Team</span></span>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn sync-btn" id="syncBtn" aria-label="Sync with your team" title="Sync" hidden>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 00.6-7.95A5.5 5.5 0 007.4 9.1 4.7 4.7 0 007 18.5z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path class="arr" d="M9.6 13.6a2.6 2.6 0 014.5-1.5M14.4 14.4a2.6 2.6 0 01-4.5 1.5M14.3 10.9v1.4h-1.4M9.7 17.1v-1.4h1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <i class="dot-badge"></i>
    </button>
  </header>
  <div class="banner" id="billBanner" role="status" hidden><span id="billText"></span></div>

  <main>
    <!-- PITCH -->
    <section class="view" id="v-pitch">
      <div class="toolrow">
        <button class="chip selchip" data-selpick id="selPickP">Selection ▾</button>
        <button class="chip" id="namesChip">Names</button>
        <button class="chip" id="fitChip">Whole pitch</button>
        <span class="spacer"></span>
        <button class="chip" id="resetPosChip">Reset positions</button>
      </div>
      <div class="pitch-wrap">
        <svg class="pitch" id="teamPitch" preserveAspectRatio="xMidYMid meet" aria-label="Rugby pitch with team shirts"></svg>
        <div class="zoomhint">Pinch to zoom · drag grass to pan</div>
      </div>
      <div class="bench" id="bench"></div>
    </section>

    <!-- SQUAD -->
    <section class="view" id="v-squad" hidden><div class="scroll" id="squadBody"></div></section>

    <!-- SELECT -->
    <section class="view" id="v-select" hidden><div class="scroll" id="selectBody"></div></section>

    <!-- MOVES -->
    <section class="view" id="v-moves" hidden>
      <div class="scroll" id="movesList"></div>
      <div id="moveEditor" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="ed-head">
          <button class="icon-btn" id="edBack" aria-label="Back to moves">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="ed-title" id="edTitle"><b id="edName">Move</b><small id="edDesc">Tap to name and describe</small></button>
          <button class="chip" id="edPlayers">Players</button>
        </div>
        <div class="banner" id="edBanner" hidden>
          <span id="edBannerText"></span>
          <button class="chip" id="edStraight">Straighten</button>
          <button class="chip" id="edDone">Done</button>
        </div>
        <div class="toolrow">
          <button class="chip" id="showChip">Show</button>
          <button class="chip" id="edPasses" hidden>Passes</button>
          <button class="chip" id="edCones">Cones</button>
          <button class="chip" id="edState" hidden>Draft</button>
          <button class="chip" id="edFit">Whole pitch</button>
          <span class="spacer"></span>
          <span class="hint" id="edHint">Drag at frame 1 = start, the last frame = finish</span>
        </div>
        <div class="pitch-wrap">
          <svg class="pitch" id="movePitch" preserveAspectRatio="xMidYMid meet" aria-label="Move editor pitch"></svg>
        </div>
        <div class="transport">
          <button class="icon-btn" id="tPrev" aria-label="Previous frame"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <button class="icon-btn play" id="tPlay" aria-label="Play"><svg width="20" height="20" viewBox="0 0 24 24" id="tPlayIcon"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
          <button class="icon-btn" id="tNext" aria-label="Next frame"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
          <input type="range" id="tSlider" min="0" max="19" step="1" value="0" aria-label="Frame">
          <div class="fcount" id="tCount">1<small>of 20</small></div>
          <button class="chip" id="tSpeed">½</button>
          <button class="chip" id="tLoop">Loop</button>
        </div>
      </div>
    </section>
    <!-- FIXTURES -->
    <section class="view" id="v-fix" hidden><div class="scroll" id="fixBody"></div></section>
    <!-- ROLE SCREENS: Team (coaches, players), Admin (team admins), Children (parents), Club (club admins) -->
    <section class="view" id="v-team" hidden><div class="scroll" id="teamBody"></div></section>
    <section class="view" id="v-admin" hidden><div class="toolrow" id="adminTabs"></div><div class="scroll" id="adminBody"></div></section>
    <section class="view" id="v-kids" hidden><div class="scroll" id="kidsBody"></div></section>
    <section class="view" id="v-club" hidden><div class="scroll" id="clubBody"></div></section>
  </main>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="pitch" aria-selected="true">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 12h14M5 6.5h14M5 17.5h14" stroke="currentColor" stroke-width="1.2"/></svg>Pitch</button>
    <button role="tab" data-tab="squad" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 14.2c3 .2 5 2.4 5 5.3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Squad</button>
    <button role="tab" data-tab="select" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l1.6 1.6L8.5 4.7M4 12.5l1.6 1.6 2.9-2.9M4 19l1.6 1.6 2.9-2.9M11 6.5h9M11 13h9M11 19.5h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Selection</button>
    <button role="tab" data-tab="moves" aria-selected="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="2.2" fill="currentColor"/><path d="M6.5 17C10 14 8 9 13 8s5-3 6-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.4 2.2" stroke-linecap="round"/><path d="M15.5 3.5h4v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Drills</button>
    <button role="tab" data-tab="fix" aria-selected="false">

    const remap = {};

/* ---------- move maths ---------- */
function keyList(ic){ return Object.keys(ic.keys).map(Number).sort((a,b)=>a-b); }
function posAt(ic,f){

// ball.carry: [{p, f, pass}] — shirt p has the ball from frame f; the pass to them leaves the previous carrier `pass` frames earlier.
// p '' means the ball is let go at frame f (kick or loose ball) and follows its own keys again.
const BALL_OFF = [1.3, -1.3];

const samePt = (a,b) => Math.abs(a[0]-b[0]) < .05 && Math.abs(a[1]-b[1]) < .05;

  const ks = keyList(ic); let i = 0, j = ks.length-1;

}
function iconIds(m){ return Object.keys(m.icons).filter(k=>k!=='ball').sort((a,b)=>a-b).concat(m.icons.ball ? ['ball'] : []); }

/* ---------- pitch gesture controller (drag icons, tap/double-tap, pan, pinch) ---------- */
function PitchCtl(svg, h){
  svg.innerHTML = pitchLines();
  const layer = svg.querySelector('.layer');
  const pts = new Map();
  const view = {cx:35, cy:60, z:null};
  let g = null, pinch = null;
  let last = {id:null, t:0}, tapTimer = null;
  const size = () => { const r = svg.getBoundingClientRect(); return [r.width, r.height, r.left, r.top]; };
  const fitZ = () => { const [W,H] = size(); return Math.min(W/78, H/128); };

    const fz = fitZ(); if(!view.z || view.z < fz) view.z = fz; view.z = Math.min(view.z, fz*6);
    const w = W/view.z, hh = H/view.z;
    const fitX = (a,b,d,c) => { const mn=a+d/2, mx=b-d/2; return mn>mx ? c : clamp(view[c===35?'cx':'cy'], mn, mx); };
    view.cx = fitX(-4, 74, w, 35); view.cy = fitX(-4, 124, hh, 60);
    svg.setAttribute('viewBox', `${(view.cx-w/2).toFixed(3)} ${(view.cy-hh/2).toFixed(3)} ${w.toFixed(3)} ${hh.toFixed(3)}`);
  }
  function toSvg(cx,cy){ const [W,H,L,T] = size(); return [view.cx - W/view.z/2 + (cx-L)/view.z, view.cy - H/view.z/2 + (cy-T)/view.z]; }

  function tap(id){
    const now = performance.now();
    if(last.id === id && now - last.t < 330){ clearTimeout(tapTimer); last = {id:null,t:0}; h.doubleTap && h.doubleTap(id); }
    else { last = {id, t:now}; clearTimeout(tapTimer); tapTimer = setTimeout(()=>{ last={id:null,t:0}; h.tap && h.tap(id); }, 300); }
  }
  svg.addEventListener('pointerdown', e => {
    e.preventDefault();
    // A first finger means no other finger is down. iOS sometimes never reports a finger lifting when the shirt it
    // touched is redrawn (as happens every frame during playback), which left a "ghost" finger that turned the next
    // one-finger touch into a pinch. Start clean.
    if(e.isPrimary){ pts.clear(); pinch = null; g = null; }
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    try { svg.setPointerCapture(e.pointerId); } catch(_){}

    else { const hit = e.target.closest && e.target.closest('[data-hit]'); if(hit){ id = hit.dataset.hit; hx = +hit.dataset.x; hy = +hit.dataset.y; } }

    else g = {kind:'pan', sx:e.clientX, sy:e.clientY, cx0:view.cx, cy0:view.cy, dragging:false, pid:e.pointerId, at:[sx,sy]};

      const [W,H,L,T] = size();
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;

    }

    if(g.kind === 'icon'){
      const [x,y] = toSvg(e.clientX, e.clientY);

    isFit(){ return !view.z || view.z <= fitZ()*1.05; },
    focusBox(x0,y0,x1,y1){ const [W,H] = size(); if(!W) return false; const fz = fitZ(); view.z = clamp(Math.min(W/(x1-x0), H/(y1-y0)), fz, fz*3.2); view.cx = (x0+x1)/2; view.cy = (y0+y1)/2; apply(); return true; },

}

function playerOptions(t, selectedId, forN, ev){

      return opt(p, st ? ' (' + st + ')' : ''); }).join('')}</optgroup>` : ''; }).join('') : '';
  return playerOptionsOwn(t, sorted, opt, ev) + borrow;
}
function playerOptionsOwn(t, sorted, opt, ev){

/* ---------- SQUAD ACTIONS ----------
   The squad's data changes, kept apart from the screens: each one changes S and saves, and never touches the page
   (no rendering, toasts or reading inputs). The screens below call them, then redraw. */
const squadSorted = () => [...S.players].sort((a,b)=>a.name.localeCompare(b.name));
// a new squad player; null if the name is blank
function addPlayer(name, pos){
  name = (name || '').trim(); if(!name) return null;
  const p = {id:uid(), name, pos:(pos || '').trim(), notes:'', available:true};
  S.players.push(p); save(); return p;
}
// f: {name, pos, notes, available, sub}; a blank name keeps the old one, sub '' takes them out of their sub-squad
function updatePlayer(pid, f){
  const p = S.players.find(x => x.id === pid); if(!p) return null;
  if(f.sub) p.sub = f.sub; else delete p.sub;
  p.name = (f.name || '').trim() || p.name; p.pos = (f.pos || '').trim(); p.notes = (f.notes || '').trim(); p.available = !!f.available;
  save(); return p;
}
// off the squad, and off every team sheet they were picked for
function removePlayer(pid){
  S.players = S.players.filter(x => x.id !== pid);
  for(const x of S.teams) for(const n in x.selection) if(x.selection[n] && x.selection[n].playerId === pid) x.selection[n].playerId = null;
  save();
}
// phone-only players go to the group on the next sync
function shareLocalPlayers(){ S.players.forEach(p => { delete p.localOnly; }); save(); }
// make the sub-squad exactly these players (moving them from any other); returns how many changed
function setSubPlayers(subId, pids){
  const want = new Set(pids); let n = 0;
  for(const p of S.players){ const was = subOfPlayer(p) === subId;
    if(want.has(p.id) && !was){ p.sub = subId; n++; } else if(!want.has(p.id) && was){ delete p.sub; n++; } }
  save(); return n;
}
// a new sub-squad (not yet saved to the group: see saveSub), next colour and last in order
function newSub(name){ const subs = subsOf(); return {id: uid(), name, color: SUB_COLOURS[subs.length % SUB_COLOURS.length], order: subs.length}; }

/* ---------- DRILL ACTIONS ----------
   Changes to drills, kept apart from the screens like the squad, selection and fixture actions: they work on the drill
   they're given and never touch the page or the editor's own state (ME: the frame shown, the shirt being edited).
   Unlike those, they don't save: a drag changes a drill many times a second, so the screens save once after a change.
   The runs, timing and passing maths follow the actions. */
// a new drill in category cat, first in the list (a draft when the phone is in a team)
function newDrill(cat){ const m = {id:uid(), name:'New drill', desc:'', icons:{}, cat}; if(syncing()) m.draft = true; S.moves.unshift(m); return m; }
// a copy of drill id, straight after it (a draft when the phone is in a team)
function duplicateDrill(id){ const i = S.moves.findIndex(x => x.id === id), m = clone(S.moves[i]); m.id = uid(); m.name += ' (copy)'; if(syncing()) m.draft = true; S.moves.splice(i + 1, 0, m); return m; }
function deleteDrill(id){ S.moves = S.moves.filter(x => x.id !== id); }
// Drafts stay on this phone; sharing sends a drill to the group on the next sync, unsharing removes it from the others
function shareDrill(m){ delete m.draft; }
function unshareDrill(m){ m.draft = true; }
// Players and parents see drills a coach marks for them, after the coach syncs; they can watch but not change them
function setForPlayers(m, on){ if(on) m.forPlayers = true; else delete m.forPlayers; }
// f: {name, desc, cat, frames, forPlayers}; a blank name becomes 'Untitled drill', forPlayers is left alone when undefined
function updateDrill(m, f){
  m.name = (f.name || '').trim() || 'Untitled drill'; m.desc = (f.desc || '').trim(); m.cat = f.cat;
  setFrames(m, f.frames);
  if(f.forPlayers !== undefined) setForPlayers(m, f.forPlayers);
}
// put shirt id (or 'ball') in the drill, or take it out if it's in; returns whether it's in now
function toggleIcon(m, id){ if(m.icons[id]) removeIcon(m, id); else addIconToMove(m, id); return !!m.icons[id]; }
function setIconColour(m, id, c){ m.icons[id].color = c; }
// shirt id (or the ball) at x, y on frame k, which becomes a keyframe; false for the ball while someone holds it
function setKey(m, id, k, x, y){ if(id === 'ball' && !ballFree(m, k)) return false; m.icons[id].keys[k] = [x, y]; return true; }
// take out keyframe k (never the first or last), so that stretch is a straight line again; false if there's none there
function removeKey(m, id, k){ const ic = m.icons[id]; if(k === 0 || k === lastOf(m) || !ic.keys[k]) return false; delete ic.keys[k]; return true; }
// Take the bends out of a player's runs: each keeps its start and end (where and when), so pauses, run lengths and the
// other runs don't change. sel = one run's index, or null for every run. Returns how many runs they have.
function straightenRuns(m, id, sel){
  const ic = m.icons[id], runs = runsOf(ic, lastOf(m));
  for(const r of sel != null ? [runs[sel]] : runs) for(const k of keyList(ic)) if(k > r.s && k < r.e) delete ic.keys[k];
  return runs.length;
}
// Set frames a..end of a player's path to speed v (metres per frame) one straight stretch at a time, keeping the path's
// shape; later movement moves to fit. Returns the stretch's new end frame, or null if the drill would get too long.
function setSpeed(m, id, a, end, v){
  const ic = m.icons[id], legLen = lg => Math.max(1, Math.round(Math.hypot(ic.keys[lg.e][0]-ic.keys[lg.s][0], ic.keys[lg.e][1]-ic.keys[lg.s][1]) / v));
  while(a < end){ const lg = legAt(ic, a), n = legLen(lg), d = n - (lg.e - lg.s);
    if(!retime(m, id, lg.s, lg.e, n)) return null;
    end += d; a = lg.s + n; }
  return end;
}
// A player's movement from frame s to frame e, standing still before and after; the drill lengthens if needed. False
// if e is past the longest a drill can be. setMoveStart keeps how long it takes; setMoveFrames keeps when it starts.
function setRunWindow(m, id, s, e){
  if(e > FRAMES_MAX - 1) return false;
  if(e > lastOf(m)) setFrames(m, Math.min(FRAMES_MAX, Math.ceil((e + 1) / 5) * 5));
  setMoveWindow(m.icons[id], s, e, lastOf(m)); return true;
}
function setMoveStart(m, id, s){ const w = moveWindow(m.icons[id], lastOf(m)); s = Math.max(0, s); return setRunWindow(m, id, s, s + w.e - w.s); }
function setMoveFrames(m, id, n){ const w = moveWindow(m.icons[id], lastOf(m)); return setRunWindow(m, id, w.s, w.s + Math.max(1, n)); }
// Cones. A new one goes near the view's centre cx, cy, each a little further along so new cones don't sit on each other.
function addCone(m, cx, cy, colour){
  m.cones = m.cones || []; const n = m.cones.length;
  const c = {id: uid(), x: r1(clamp(cx + (n % 5) * 2 - 4, 1, 69)), y: r1(clamp(cy + Math.floor(n / 5) * 2, 1, 119)), c: colour || 'blue'};
  m.cones.push(c); return c;
}
const coneById = (m, cid) => (m.cones || []).find(q => q.id === cid);
function setConeColour(m, cid, colour){ const c = coneById(m, cid); if(c) c.c = colour; }
function removeCone(m, cid){ m.cones = (m.cones || []).filter(q => q.id !== cid); }
function clearCones(m){ m.cones = []; }
// drag cone cid to x, y: anything snapped to it moves with it
function dragCone(m, cid, x, y){ const c = coneById(m, cid); if(c) moveCone(m, c, x, y); }

const moveCtl = PitchCtl($('#movePitch'), {
  pick: (x,y) => {

    const m = curMove(), ic = m && m.icons[ME.editing]; if(!ic) return null;

    if(c){ save(); renderMoveLayer(); toast('Snapped to the ' + (CONES.find(x => x[0] === c.c) || CONES[0])[2].toLowerCase() + ' cone'); }
  },

function play(){
  if(!curMove()) return;
  const endF = lastOf(curMove()); if(ME.frame >= endF) ME.frame = 0;
  ME.playing = true; let last = performance.now();

    if(!ME.playing) return;
    ME.frame += (now-last) / (FRAME_MS/ME.speed); last = now;
    if(ME.frame >= endF){ if(ME.loop) ME.frame = 0; else { ME.frame = endF; ME.playing = false; } }
    renderMoveLayer(); updateTransport();
    if(ME.playing) ME.raf = requestAnimationFrame(step);
  };
  ME.raf = requestAnimationFrame(step); updateTransport();
}

const b64u = bytes => { let s=''; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };

}
async function decodeCode(text){

  const m = text.match(/RTP([01])\.([A-Za-z0-9_-]+)/); if(!m) throw new Error('That is not a Rugby Team Picker code or link.');

   - only this phone changed it → send it; only the group changed it → take theirs;
   - both changed a move → keep both (ours becomes "(my version)"); both changed a team's squad/sheet → ask.

async function fbErr(r){ try { const j = await r.json(); return (j.error && (j.error.message || j.error.status)) || 'HTTP '+r.status; } catch(e){ return 'HTTP '+r.status; } }
// One anonymous Firebase login per phone, shared by all its groups and kept when leaving one, so each phone is one
// registration per group. Older versions kept a login per group: the active group's is adopted the first time.
function phoneAuth(){
  if(!S.auth){
    const src = [S.sync, ...Object.values(S.parked || {}).map(w => w.sync)].find(z => z && z.refresh);
    S.auth = src ? {token: src.token, refresh: src.refresh, tokenExp: src.tokenExp} : {};
  }
  return S.auth;
}
async function fbToken(){
  const z = phoneAuth();
  if(z.token && z.tokenExp > Date.now() + 60000) return z.token;
  if(z.refresh){
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(z.refresh)});
    if(r.ok){ const j = await r.json(); z.token = j.id_token; z.refresh = j.refresh_token; z.tokenExp = Date.now() + (+j.expires_in)*1000; save(); return z.token; }
    // only a login that no longer exists is replaced; anything else (no signal, a busy server) is tried again later,
    // because a new login isn't registered in any team
    const why = await fbErr(r);
    if(!/TOKEN_EXPIRED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN|USER_DISABLED|MISSING_REFRESH_TOKEN/.test(why)){ const e = new Error('Could not sign in (' + why + '). Try again in a moment.'); e.status = r.status; throw e; }
    z.lost = Date.now();
  }
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{"returnSecureToken":true}'});
  if(!r.ok) throw new Error('Could not sign in: ' + await fbErr(r));
  const j = await r.json(); z.token = j.idToken; z.refresh = j.refreshToken; z.tokenExp = Date.now() + (+j.expiresIn)*1000; save(); return z.token;
}
async function fb(method, path, body){
  const tok = await fbToken();
  const r = await fetch(DOCS() + path, {method, headers:{'Authorization':'Bearer '+tok, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  if(r.status===404 && method==='GET') return null;
  if(!r.ok){ const e = new Error(await fbErr(r)); e.status = r.status; throw e; }
  return r.json();
}
const niceErr = e => /fetch|network|load failed/i.test(e.message||'') ? 'No connection. Try again when you have signal.' : (e.message || 'Something went wrong');

async function listItems(code){

    page = j.nextPageToken;

// Items: 't_<teamId>' is a team without moves; 'mv_<moveId>' is a move in the group's shared library.
// 'm_<teamId>_<moveId>' is the old per-team move format: never pulled, and retired (marked deleted) by whoever synced it.
function localItems(){
  const out = {};
  for(const t of S.teams){ if(t.localOnly) continue;
    const core = Object.assign({}, t); delete core.moves; delete core.localOnly;
    out['t_'+t.id] = {kind:'team', teamId:t.id, json: JSON.stringify(core)};
  }
  for(const pl of S.players){ if(pl.localOnly) continue; const q = Object.assign({}, pl); delete q.localOnly; out['p_'+pl.id] = {kind:'player', teamId:'', json: JSON.stringify(q)}; }
  for(const m of S.moves){ if(m.draft) continue; const mm = Object.assign({}, m); delete mm.draft; delete mm.localOnly; out['mv_'+m.id] = {kind:'move', teamId:'', json: JSON.stringify(mm)}; }
  return out;
}
const itemTeam = id => id.startsWith('t_') ? id.slice(2) : id.startsWith('m_') ? id.slice(2, id.indexOf('_', 2)) : '';
// ids sync leaves alone: phone-only teams, and drafts that were never shared (a shared move turned back into a draft is
// still in base, so sync removes it from the group)
const keptOnPhone = base => new Set(S.teams.filter(t => t.localOnly).map(t => 't_'+t.id).concat(S.moves.filter(m => m.draft && !base['mv_'+m.id]).map(m => 'mv_'+m.id))
  .concat(S.players.filter(p => p.localOnly && !base['p_'+p.id]).map(p => 'p_'+p.id)));
function pendingChanges(){
  if(!syncing() || isViewer()) return 0;
  const base = S.sync.base || {}, loc = localItems(), localOnly = keptOnPhone(base); let n = 0;
  for(const id in loc) if(hashStr(loc[id].json) !== base[id]) n++;
  for(const id in base) if(!loc[id] && !id.startsWith('m_') && !localOnly.has(id)) n++;
  return n;
}

// What a sync does with each item, worked out from this phone's items (local), the group's (remote) and the hashes at
// the last sync (base), without sending or changing anything. choices: {teamId: 'mine'|'theirs'} for teams changed on
// both sides. Returns {push, pull, copies (drills changed on both sides: ours is kept as "(my version)"), legacy
// (old-format drills to take in), same (unchanged), needs (teams changed on both sides with no choice yet)}.
function planSync(local, remote, base, choices){
  const localOnly = keptOnPhone(base);
  const ids = [...new Set([...Object.keys(local), ...Object.keys(remote), ...Object.keys(base)])].filter(id => !localOnly.has(id));
  const live = id => remote[id] && !remote[id].deleted ? remote[id] : null;
  const decide = id => {
    const L = local[id], R = live(id), B = base[id] || null;
    const lh = L ? hashStr(L.json) : null, rh = R ? hashStr(R.json) : null;
    if(lh === rh) return 'same';
    const lc = lh !== B, rc = rh !== B;
    if(lc && !rc) return 'push';
    if(rc && !lc) return 'pull';
    if(!L) return 'pull'; if(!R) return 'push'; // edited on one side, deleted on the other: keep the edit
    return 'both';
  };
  const push = [], pull = [], copies = [], needs = [], legacy = [], same = [];
  for(const id of ids){
    // old per-team format: take in any move not seen before (it goes back up as mv_), then retire it on a later sync
    if(id.startsWith('m_')){ if(base[id] && live(id)) push.push(id); else if(live(id)) legacy.push(id); continue; }
    let d = decide(id);
    if(d==='both' && id.startsWith('t_')){ const tid = itemTeam(id), c = choices[tid];
      if(!c){ needs.push({teamId:tid, name: JSON.parse(local[id].json).name, by: remote[id].by}); continue; }
      d = c==='mine' ? 'push' : 'pull'; }
    if(d==='same'){ same.push(id); continue; }
    if(d==='both'){ pull.push(id); if(id.startsWith('mv_')) copies.push(id); continue; } // a player edited on two phones: the group's version wins
    (d==='push' ? push : pull).push(id);
  }
  return {push, pull, copies, legacy, same, needs};
}
// Take in what came from the group: each pulled item replaces (or, if deleted there, removes) this phone's copy; an
// old-format drill not seen before is added; our "(my version)" copies go first. Records each one taken in in newBase.
// Returns how many changed.
function applyPulled(plan, remote, copyMoves, newBase){
  const live = id => remote[id] && !remote[id].deleted ? remote[id] : null;
  let got = 0;
  for(const id of plan.pull){
    const R = live(id);
    if(id.startsWith('t_')){
      const tid = itemTeam(id), i = S.teams.findIndex(t => t.id===tid);
      if(!R){ if(i>=0){ S.teams.splice(i,1); got++; } continue; }
      const nt = JSON.parse(R.json);
      if(nt.players){ const w = {teams:[nt]}; pooledSquad(w); for(const pl of w.players) if(!S.players.some(x => x.id === pl.id)) S.players.push(pl); } // from a phone on an older version
      if(i>=0) S.teams[i] = nt; else S.teams.push(nt);
    } else if(id.startsWith('p_')){
      const pid = id.slice(2), i = S.players.findIndex(x => x.id===pid);
      if(!R){ if(i>=0){ S.players.splice(i,1); got++; } continue; }
      if(i>=0) S.players[i] = JSON.parse(R.json); else S.players.push(JSON.parse(R.json));
    } else {
      const mid = id.slice(3); let i = S.moves.findIndex(m => m.id===mid);
      if(i>=0 && S.moves[i].draft){ S.moves[i].id = uid(); i = -1; } // keep the draft; the group's version comes in beside it
      if(!R){ if(i>=0){ S.moves.splice(i,1); got++; } continue; }
      if(i>=0) S.moves[i] = JSON.parse(R.json); else S.moves.unshift(JSON.parse(R.json));
    }
    newBase[id] = hashStr(R.json); got++;
  }
  for(const id of plan.legacy){ const m = JSON.parse(live(id).json); if(!S.moves.some(x => x.id===m.id)){ S.moves.push(m); got++; } newBase[id] = hashStr(live(id).json); }
  S.moves.unshift(...copyMoves);
  if(!S.teams.length) S.teams.push(Object.assign(newTeam('Main selection'), {localOnly:true}));
  if(!S.teams.some(t => t.id===S.currentTeamId)) S.currentTeamId = S.teams[0].id;
  return got;
}
// Sync with the group: fetch its items, plan, send ours, then take in theirs. choices: see planSync. Returns
// {needs:[...]} when a choice is required, otherwise {sent, got, copies}.
async function syncNow(choices = {}, retry = true){
  const z = S.sync, code = z.group, remote = await listItems(code);
  if(S.teams.some(t => t.placeholder)){
    const hasTeams = Object.values(remote).some(r => r.kind==='team' && !r.deleted);
    S.teams = S.teams.filter(t => !(t.placeholder && hasTeams && !pickedCount(t)));
    S.teams.forEach(t => { delete t.placeholder; });
  }
  const local = localItems(), plan = planSync(local, remote, z.base || {}, choices);
  if(plan.needs.length) return {needs: plan.needs};
  const newBase = {}, keep = id => { if(local[id]) newBase[id] = hashStr(local[id].json); };
  plan.same.forEach(keep);
  const {push, copies} = plan;
  // each write carries a precondition, so if someone syncs in between this run starts again instead of overwriting them
  const who = z.who || '', now = String(Date.now()), writes = [];
  const write = (id, item) => {
    const Rd = remote[id], fields = {kind:{stringValue: id.startsWith('t_') ? 'team' : id.startsWith('p_') ? 'player' : 'move'}, teamId:{stringValue: itemTeam(id)}, json:{stringValue: item ? item.json : ''},
      deleted:{booleanValue: !item}, by:{stringValue: who}, at:{integerValue: now}};
    writes.push({update:{name: DOCNAME(`groups/${code}/items/${id}`), fields}, currentDocument: Rd ? {updateTime: Rd.updateTime} : {exists:false}});
  };
  for(const id of push){ write(id, local[id]); keep(id); }
  // a move changed on both sides: theirs keeps the name, ours is saved alongside as "(my version)" so nothing is lost
  const copyMoves = [];
  for(const id of copies){ const m = JSON.parse(local[id].json); m.id = uid(); m.name += ' (my version)';
    const nid = 'mv_'+m.id, item = {kind:'move', teamId:'', json: JSON.stringify(m)};
    write(nid, item); newBase[nid] = hashStr(item.json); copyMoves.push(m); }
  try { for(let i=0;i<writes.length;i+=400) await fb('POST', ':commit', {writes: writes.slice(i, i+400)}); }
  catch(e){ if(retry && (e.status===409 || e.status===400 || /FAILED_PRECONDITION|ABORTED/.test(e.message))) return syncNow(choices, false); throw e; }

}
const ago = t => { if(!t) return 'never'; const s = (Date.now()-t)/1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s/60)+' min ago' : s < 86400 ? Math.round(s/3600)+' h ago' : new Date(t).toLocaleDateString('en-GB'); };
$('#syncBtn').addEventListener('click', () => syncing() ? runSync() : showGate(true));

// A phone can belong to several groups. The active group's data lives in S.teams, S.moves, S.currentTeamId and S.sync
// as before; the others wait in S.parked[joinCode] and are swapped in when you switch.
const WORKSPACE = ['teams', 'players', 'moves', 'currentTeamId', 'sync'];
const GROUP_COLOURS = ['#3FB6E8', '#B98CF5', '#F0883E', '#4FD1A5', '#F06BA8', '#A3D94A', '#6C8CFF', '#E8C547'];
const groupColour = code => { let h = 7; for(const c of String(code||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return GROUP_COLOURS[h % GROUP_COLOURS.length]; };
const groupsOnPhone = () => (syncing() ? [{code: S.sync.group, name: S.sync.groupName, active: true, teams: S.teams.length}] : [])
  .concat(Object.entries(S.parked || {}).map(([code, w]) => ({code, name: w.sync.groupName, lastSync: w.sync.lastSync, teams: w.teams.length})));
function parkGroup(){ S.parked = S.parked || {}; const w = {}; for(const k of WORKSPACE) w[k] = S[k]; S.parked[S.sync.group] = w; }
function switchGroup(code){
  const w = S.parked && S.parked[code]; if(!w) return;
  stopPlay(); closeSheet(); if(syncing()) parkGroup();
  for(const k of WORKSPACE) S[k] = w[k];
  delete S.parked[code]; ME.moveId = null; ME.editing = null; teamZoomed = false;
  save(); syncDot(); renderAll(); toast(`Now in ${S.sync.groupName} · last synced ${ago(S.sync.lastSync)}`);
  checkInboxQuietly();
}
// Join or create a group. Shown on first open (a code is needed to use the app) and after leaving a group.
function showGate(canClose){
  const g = $('#gate'), pre = normCode((location.hash.match(/join=([\w-]+)/)||[])[1]);
  g.innerHTML = `<div class="gate-in">
    <div class="eyebrow">Rugby Team Picker</div><h1>${syncing() ? 'Add another group' : 'Join your coaching group'}</h1>
    <p class="muted">Your group shares teams and moves. You edit on your phone, then tap Sync to send your changes and get everyone else's. Ask your head coach for the group code.</p>
    <div class="field"><label class="field-label" for="gtCode">Group code</label><input id="gtCode" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD-EFGH-JK" value="${pre ? fmtCode(pre) : ''}"></div>
    <div class="field"><label class="field-label" for="gtWho">Your name</label><input id="gtWho" type="text" placeholder="Shown to your group, e.g. Chris" value="${esc((S.sync||{}).who||'')}"></div>
    <button class="btn wide" id="gtJoin">Join group</button>
    ${canClose ? '<button class="btn ghost wide" id="gtClose">Cancel</button>' : ''}
    <p class="hint" id="gtErr" role="alert"></p></div>`;
  g.hidden = false;
  tidyCode($('#gtCode', g));
  const err = m => { $('#gtErr', g).textContent = m; }, who = () => $('#gtWho', g).value.trim();
  const busy = on => $$('button', g).forEach(b => b.disabled = on);
  const enter = async grp => {
    if(/join=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    g.hidden = true;
    if(syncing() && S.sync.group === grp.code){ toast('You are already in '+grp.name); return; }
    if(S.parked && S.parked[grp.code]){ switchGroup(grp.code); return; }
    phoneAuth();
    if(syncing()){ parkGroup(); S.teams = [Object.assign(newTeam('My team'), {placeholder: true})]; S.players = []; S.moves = []; S.currentTeamId = S.teams[0].id; ME.moveId = null; }
    S.sync = {group: grp.code, groupName: grp.name, who: who(), base: {}, lastSync: 0}; save();
    syncDot(); renderAll(); await chooseUploads();
  };
  $('#gtJoin', g).addEventListener('click', async () => {
    const code = normCode($('#gtCode', g).value);
    if(code.length !== 10) return err('Enter the 10-character code from your group.'); if(!who()) return err('Enter your name.');
    busy(true); err('Checking…');
    try { const grp = await fetchGroup(code); if(!grp){ err('No group has that code. Check it with whoever gave it to you.'); busy(false); return; } await enter(grp); }
    catch(e){ err(niceErr(e)); busy(false); }
  });
  const c = $('#gtClose', g); if(c) c.addEventListener('click', () => { g.hidden = true; });
}
// On joining, choose which of this phone's teams go to the group. Samples, and names the group already has, start unticked.
const isSampleMove = m => m.name === 'Crash ball 12' && /^Off first-phase ball: 9 to 10/.test(m.desc || '');
async function chooseUploads(){
  let remote = {}; try { remote = await listItems(S.sync.group); } catch(e){}
  const live = Object.values(remote).filter(r => !r.deleted && r.json), names = kind => new Set(live.filter(r => r.kind===kind).map(r => baseName(JSON.parse(r.json).name)));
  const teamNames = names('team'), moveNames = names('move');
  const inGroup = id => remote[id] && !remote[id].deleted;
  const teams = S.teams.filter(t => !t.placeholder && !inGroup('t_'+t.id)), moves = S.moves.filter(m => !inGroup('mv_'+m.id));
  const squad = S.players.filter(pl => !inGroup('p_'+pl.id)), groupHasSquad = live.some(r => r.kind==='player'), sampleSquad = squad.length && squad.every(pl => SAMPLE_NAMES.has(pl.name));
  if(!teams.length && !moves.length && !squad.length){ runSync(); return; }
  const opt = (kind, id, name, info, dup, sample, dupText = 'the group already has one with this name') => `<label class="opt"><input type="checkbox" data-up="${kind}:${id}"${dup||sample?'':' checked'}><span><b>${esc(name)}</b><small>${info}${dup?' · '+dupText:''}${sample?' · sample data':''}</small></span></label>`;
  openSheet(`<div class="eyebrow">${esc(S.sync.groupName)}</div><h2>Share with the group?</h2>
    <p class="muted">Ticked items go to the group when you sync. Unticked teams stay on this phone, and unticked drills go into your drafts; you can share them later.</p>
    ${teams.length ? `<div class="field-label">Teams</div><div class="opts">${teams.map(t => opt('t', t.id, t.name, pickedCount(t)+' players picked', teamNames.has(baseName(t.name)), /\(sample\)/i.test(t.name))).join('')}</div>` : ''}
    ${squad.length ? `<div class="field-label">Squad</div><div class="opts">${opt('s', 'all', squad.length+' player'+(squad.length>1?'s':''), esc(squad.slice(0, 4).map(pl => pl.name).join(', '))+(squad.length > 4 ? '…' : ''), groupHasSquad, sampleSquad, 'the group already has a squad; if unticked they stay on this phone')}</div>` : ''}
    ${moves.length ? `<div class="field-label">Drills</div><div class="opts">${moves.map(m => opt('m', m.id, m.name, iconIds(m).filter(i => i!=='ball').length+' players', moveNames.has(baseName(m.name)), isSampleMove(m))).join('')}</div>` : ''}
    <button class="btn wide" id="upGo">Sync now</button>`,
    el => $('#upGo', el).addEventListener('click', () => {
      $$('[data-up]', el).forEach(c => { const [k, id] = c.dataset.up.split(':');
        if(k==='s'){ squad.forEach(pl => { if(c.checked) delete pl.localOnly; else pl.localOnly = true; }); return; }
        const x = (k==='t' ? S.teams : S.moves).find(y => y.id===id); if(!x) return; if(k==='t') x.localOnly = !c.checked; else if(c.checked) delete x.draft; else x.draft = true; });
      save(); closeSheet(); runSync(); }));
}
function showGroup(){
  const z = S.sync, n = pendingChanges(), link = linkBase() + '#join=' + fmtCode(z.group);
  openSheet(`<div class="gcard" style="--gc:${groupColour(z.group)}"><span class="eyebrow">Your group</span><b>${esc(z.groupName)}</b><small>${S.teams.length} team${S.teams.length===1?'':'s'}, ${S.moves.length} drill${S.moves.length===1?'':'s'}</small></div>
    <div class="field"><div class="field-label">Join code · only for your own coaches</div><div class="gcode">${fmtCode(z.group)}</div></div>
    <div class="field"><div class="field-label">Send code · give this to other groups</div><div class="gcode" id="gpBox">${z.mailbox ? fmtCode(z.mailbox) : '…'}</div>
      <p class="hint">Other groups use it to send you moves. It can't be used to see or change anything in your group.</p></div>
    <p class="muted">Last synced ${ago(z.lastSync)}. ${n ? `${n} change${n>1?'s':''} on this phone not sent yet.` : 'No changes waiting to be sent.'}</p>
    <div class="row-btns"><button class="btn" id="gpSync">Sync now</button><button class="btn ghost" id="gpInvite">Invite a coach</button><button class="btn ghost" id="gpSend">Share send code</button></div>
    <div class="field"><div class="field-label">Drills sent to this group</div><div class="add-row"><p class="muted" id="gpInbox" style="align-self:center">Tap Check now to look for moves other groups have sent.</p><button class="btn ghost" id="gpCheck">Check now</button></div></div>
    <div class="field"><label class="field-label" for="gpWho">Your name in the group</label><div class="add-row"><input id="gpWho" type="text" value="${esc(z.who||'')}"><button class="btn ghost" id="gpWhoSave">Save</button></div></div>
    <div class="field"><div class="field-label">Groups on this phone</div><div class="tlist">${groupsOnPhone().map(gr => `<div class="trow"><button class="btn ghost${gr.active?' cur':''}" data-gsw="${gr.code}" style="--gc:${groupColour(gr.code)}${gr.active ? ';outline-color:'+groupColour(gr.code) : ''}"><span class="gdot"></span>${esc(gr.name)} <span class="muted" style="font-weight:500">· ${gr.teams} team${gr.teams===1?'':'s'} · ${gr.active ? 'open now' : 'synced '+ago(gr.lastSync)}</span></button></div>`).join('')}</div>
      <button class="btn ghost" id="gpAdd">Add another group</button></div>
    <button class="btn danger" id="gpLeave">Leave ${esc(z.groupName)}</button>
    <p class="hint">Anyone with the join code can see and change the group's teams and moves, so only give it to your coaches.</p>`,
    el => {
      $('#gpSync', el).addEventListener('click', () => { closeSheet(); runSync(); });
      $('#gpInvite', el).addEventListener('click', async () => {
        const text = `Join ${z.groupName} in Rugby Team Picker. Open this link, or enter code ${fmtCode(z.group)}: ${link}`;
        try { if(canShare()) await navigator.share({title: z.groupName, text}); else { await navigator.clipboard.writeText(text); toast('Invite copied'); } } catch(e){ if(e.name!=='AbortError') toast('Code: '+fmtCode(z.group)); }
      });
      if(!z.mailbox) ensureMailbox().then(b => { const g = $('#gpBox', el); if(g) g.textContent = fmtCode(b); }).catch(() => { const g = $('#gpBox', el); if(g) g.textContent = 'Sync first'; });
      $('#gpSend', el).addEventListener('click', async () => {
        let box = z.mailbox; try { box = box || await ensureMailbox(); } catch(e){ return toast(niceErr(e)); }
        const text = `To send a drill to ${z.groupName} in Rugby Team Picker, use send code ${fmtCode(box)}`;
        try { if(canShare()) await navigator.share({title: z.groupName, text}); else { await navigator.clipboard.writeText(text); toast('Send code copied'); } } catch(e){ if(e.name!=='AbortError') toast('Send code: '+fmtCode(box)); }
      });
      $('#gpCheck', el).addEventListener('click', async () => {
        const out = $('#gpInbox', el), btn = $('#gpCheck', el); btn.disabled = true; out.textContent = 'Checking…';
        try { const n = await checkInbox(); if(!n) out.textContent = 'No drills waiting. Drills sent to your send code ' + fmtCode(S.sync.mailbox) + ' appear here.'; }
        catch(e){ if(e.gone){ closeSheet(); askNewCode(); } else out.textContent = 'Could not check: ' + niceErr(e); }
        finally { btn.disabled = false; }
      });
      $('#gpWhoSave', el).addEventListener('click', () => { z.who = $('#gpWho', el).value.trim() || z.who; save(); toast('Name saved'); });
      $$('[data-gsw]', el).forEach(b => b.addEventListener('click', () => { if(b.dataset.gsw !== z.group) switchGroup(b.dataset.gsw); else closeSheet(); }));
      $('#gpAdd', el).addEventListener('click', () => { closeSheet(); showGate(true); });
      const others = Object.keys(S.parked || {});
      $('#gpLeave', el).addEventListener('click', () => askConfirm('Leave '+z.groupName+'?',
        others.length ? `Its teams and drills are removed from this phone${n ? `, including ${n} change${n>1?'s':''} you haven't synced` : ''}. The group keeps everything you've synced, and you can join again with the code.`
                      : 'Your teams stay on this phone but stop syncing. You need the code to join again.', 'Leave group', () => {
        if(others.length){ S.sync = null; const next = others[0]; S.parked[next] && switchGroup(next); }
        else { S.sync = {who: z.who}; save(); syncDot(); showGate(false); }
      }));
    });
}

/* ---------- boot ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
if(ME.moveId === null && S.ui.tab === 'moves') {}
showTab(TAB);
checkLinkImport();
window.addEventListener('hashchange', checkLinkImport);
if('serviceWorker' in navigator && location.protocol==='https:' && !INFRAME){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
syncDot();
function checkJoinLink(){ if(fbOn() && /join=/.test(location.hash)) showGate(syncing()); }
if(fbOn() && !syncing()) showGate(false); else { checkJoinLink(); if(fbOn()) setTimeout(checkInboxQuietly, 1200); }
window.addEventListener('hashchange', checkJoinLink);
window.__rtp = {switchGroup, showGroup, get S(){return S;}, ME, encodeCode, decodeCode, handleImport, posAt, FB, runSync, showGate, checkInbox, sendToGroup};
})();
</script>

</body>
</html>
